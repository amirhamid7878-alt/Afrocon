
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON ADS 5000</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050510;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 40px 15px;
    text-align: center;
    background: linear-gradient(135deg,#09091d,#240c38);
    border-bottom: 2px solid #00eaff;
    box-shadow: 0 0 25px #00eaff;
}

h1 {
    color: #00f7ff;
    font-size: 35px;
    text-shadow: 0 0 15px #00eaff;
}

header p {
    color: #ff38e8;
}

.counter {
    color: #00f7ff;
    margin-top: 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 300px);
    justify-content: center;
    gap: 25px;
    padding: 30px 10px;
}

.ad-box {
    width: 300px;
    min-height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111126;
    border: 1px solid #00eaff;
    border-radius: 10px;
    box-shadow: 0 0 12px #00eaff66;
    overflow: hidden;
}

.ad-box:hover {
    box-shadow: 0 0 20px #00eaff,
                0 0 35px #ff00e6;
}

.ad-title {
    color: #ff38e8;
    text-align: center;
    margin-bottom: 8px;
    font-size: 12px;
}

footer {
    text-align: center;
    padding: 30px;
    color: #00eaff;
    border-top: 1px solid #00eaff;
}

@media(max-width:340px) {
    .ad-box {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚡ NEON ADS ⚡</h1>
    <p>WELCOME TO THE NEON ADVERTISING WORLD</p>
    <div class="counter">
        TOTAL AD SLOTS: 5000
    </div>
</header>

<main class="grid" id="ads"></main>

<footer>
    © 2026 NEON ADS - ALL RIGHTS RESERVED
</footer>

<script>
const TOTAL_ADS = 5000;
const ads = document.getElementById("ads");

for(let i = 1; i <= TOTAL_ADS; i++) {

    const box = document.createElement("section");
    box.className = "ad-box";

    const content = document.createElement("div");

    const title = document.createElement("div");
    title.className = "ad-title";
    title.textContent = "ADVERTISEMENT #" + i;

    const ad = document.createElement("div");
    ad.style.width = "300px";
    ad.style.height = "250px";

    const scriptCode = document.createElement("script");

    const options = document.createElement("script");

    options.textContent = `
        atOptions = {
            'key': '16332f37472aa1ee64e0db6118808f97',
            'format': 'iframe',
            'height': 250,
            'width': 300,
            'params': {}
        };
    `;

    const external = document.createElement("script");
    external.src =
    "https://czernik.org/22/16332f37472aa1ee64e0db6118808f97";

    ad.appendChild(options);
    ad.appendChild(external);

    content.appendChild(title);
    content.appendChild(ad);

    box.appendChild(content);
    ads.appendChild(box);
}
</script>

</body>
</html>
